services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vle9-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.listen-address=127.0.0.1:9090"
      - "--web.enable-lifecycle"
    volumes:
      - /opt/vle9/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/vle9/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: vle9-alertmanager
    restart: unless-stopped
    network_mode: host
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=127.0.0.1:9093"
    volumes:
      - /opt/vle9/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: vle9-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=127.0.0.1:9100"
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: vle9-cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    image: grafana/grafana:11.2.2
    container_name: vle9-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ENABLE_GZIP: "true"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD__FILE: "/run/secrets/grafana_admin_password"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - /opt/vle9/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/vle9/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /opt/vle9/monitoring/grafana_admin_password:/run/secrets/grafana_admin_password:ro

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

