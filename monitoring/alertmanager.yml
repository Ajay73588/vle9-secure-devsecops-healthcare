global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity", "category"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h
  receiver: "vle9-alert-log"

receivers:
  - name: "vle9-alert-log"
    webhook_configs:
      - url: "http://127.0.0.1:9099/alerts"
        send_resolved: true

