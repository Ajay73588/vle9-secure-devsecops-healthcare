apiVersion: v1
kind: ServiceAccount
metadata:
  name: securecare-sa
  namespace: securecare
  labels:
    app: securecare
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: securecare-readonly-role
  namespace: securecare
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["securecare-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: securecare-readonly-binding
  namespace: securecare
subjects:
  - kind: ServiceAccount
    name: securecare-sa
    namespace: securecare
roleRef:
  kind: Role
  name: securecare-readonly-role
  apiGroup: rbac.authorization.k8s.io

