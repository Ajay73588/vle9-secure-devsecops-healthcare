apiVersion: v1
kind: Service
metadata:
  name: securecare-svc
  namespace: securecare
  labels:
    app: securecare
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "3000"
spec:
  type: NodePort
  selector:
    app: securecare
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
      protocol: TCP

