kind: Secret
metadata:
  name: securecare-secrets
  namespace: securecare
  labels:
    app: securecare
type: Opaque
stringData:
  JWT_SECRET: "<REPLACE_WITH_RUNTIME_RANDOM_HEX>"
  ADMIN_PASS_ENV: "<REPLACE_WITH_RUNTIME_SECRET>"
  DOCTOR_PASS_ENV: "<REPLACE_WITH_RUNTIME_SECRET>"
  NURSE_PASS_ENV: "<REPLACE_WITH_RUNTIME_SECRET>"

