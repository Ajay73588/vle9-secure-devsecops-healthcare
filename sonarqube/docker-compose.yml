services:
  sonarqube:
    image: sonarqube:9.9-community
    container_name: vle9-sonarqube
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_WEB_JAVAOPTS: "-Xms256m -Xmx384m"
      SONAR_CE_JAVAOPTS: "-Xms256m -Xmx384m"
      SONAR_SEARCH_JAVAOPTS: "-Xms512m -Xmx512m"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/system/status | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

